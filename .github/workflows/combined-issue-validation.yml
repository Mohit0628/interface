name: Combined issue branch validation
on:
  push:
    branches:
      - fix/707-849-850-851-combined
  workflow_dispatch:
concurrency:
  group: combined-issue-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install with frozen lockfile
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun lint
      - name: Typecheck
        run: bun typecheck
      - name: Tokens
        run: bun run check:tokens
      - name: Docs content
        run: bun run check:content
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Indexer codegen
        run: bun run --cwd apps/s03-indexer codegen
      - name: Indexer build
        run: bun run --cwd apps/s03-indexer build
      - name: Indexer tests
        run: bun run --cwd apps/s03-indexer test
      - name: Indexer fixture sync
        env:
          SO4_CONTRACTS_REPO: ${{ github.workspace }}/apps/s03-indexer/tests/fixtures/contracts-repo
        run: bun run --cwd apps/s03-indexer sync:contracts:local
      - name: Manifest validation
        run: bash scripts/validate-manifest.sh apps/s03-indexer/config/contracts.local.json
      - name: Web typecheck
        run: bun run --cwd apps/web typecheck
      - name: Web build
        run: bun run --cwd apps/web build
      - name: Nitro/Vite 7 development-server smoke
        run: |
          set +e
          timeout 30s bun run --cwd apps/web dev > /tmp/so4-vite-dev.log 2>&1
          status=$?
          set -e
          cat /tmp/so4-vite-dev.log
          if grep -F 'vite builder requires ^8' /tmp/so4-vite-dev.log; then
            echo "Nitro-Vite compatibility warning persists"
            exit 1
          fi
          if ! grep -E 'ready in|Local:|localhost:' /tmp/so4-vite-dev.log; then
            echo "Vite dev server did not start"
            exit 1
          fi
          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
            echo "Vite dev terminated unexpectedly with status $status"
            exit 1
          fi
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Playwright E2E
        run: bun run test:e2e
      - name: Clean clone dependency verification
        run: |
          git clone "file://$PWD" /tmp/so4-cleanroom
          cd /tmp/so4-cleanroom
          bun install --frozen-lockfile
          bun lint && bun typecheck && bun run check:content && bun run test && bun run build

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install with frozen lockfile
        run: bun install --frozen-lockfile
      - name: Coverage
        run: bun run test:coverage
