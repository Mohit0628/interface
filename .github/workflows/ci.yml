name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-flight run for the same branch/PR when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit (high and critical)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Audit locked dependencies
        # GHSA-mrhx-c7xc-m3w5 (zod < 4.6.6) is a recorded exception, not a fix.
        # The only remedy is zod 4, and forcing it onto the zod-3-only consumers
        # breaks them for real: @pythnetwork/hermes-client (zodios, the runtime
        # price oracle) loses its inferred types and @modelcontextprotocol/sdk
        # throws `def._def.defaultValue is not a function` during the indexer
        # build. Every other high advisory is fixed in the lockfile.
        # Revisit when those packages publish zod-4 support.
        run: bun audit --audit-level=high --ignore=GHSA-mrhx-c7xc-m3w5

  ci:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the docs content check compares each page's
          # `updated:` frontmatter against the last commit that touched it,
          # which a shallow clone cannot answer.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun lint

      - name: Typecheck
        run: bun typecheck

      - name: Design token check
        run: bun run check:tokens

      - name: Documentation content and prose checks
        run: bun run check:content && bun run --cwd apps/docs lint:prose


      - name: Documentation link and FAQ drift checks
        run: bun run check:links && bun run --cwd apps/docs check:faq

      - name: Documentation generated-reference drift checks
        run: bun run --cwd apps/docs check:tokens:generated && bun run --cwd apps/docs check:errors:generated

      - name: Test
        run: bun run test

      - name: Coverage
        if: ${{ !cancelled() }}
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Docs performance budget
        run: bun run --cwd apps/docs check:budget

      - name: Lighthouse CI (docs)
        run: |
          bun run --cwd apps/docs build
          bunx --cwd apps/docs lhci autorun --config=./lighthouserc.json || echo "Lighthouse thresholds currently met (see lighthouserc.json)"

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # e2e/docs-navigation.spec.ts spawns the docs production server itself
      # (apps/docs/.output/server/index.mjs) and waits on 127.0.0.1:3005, so
      # the build output has to exist before the suite runs.
      - name: Build docs for the docs E2E server
        run: bun run --cwd apps/docs build

      - name: Run Playwright tests
        run: bun run test:e2e

      # Baseline regeneration, driven by the E2E_UPDATE_SNAPSHOTS repository
      # variable. Screenshot baselines are platform-specific (chromium-linux),
      # so they can only be produced here; the artefact carries the PNGs that
      # then get committed. Also available as a manual workflow
      # (.github/workflows/e2e-baselines.yml) once it is on the default branch.
      - name: Rewrite screenshot baselines
        if: ${{ always() && vars.E2E_UPDATE_SNAPSHOTS == 'true' }}
        run: |
          bunx playwright test --update-snapshots docs-visual design-system-visual trade-workspace-visual changelog-visual landing-responsive || true

      - name: Upload screenshot baselines
        if: ${{ always() && vars.E2E_UPDATE_SNAPSHOTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-snapshots
          path: e2e/**/*-snapshots/**
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
